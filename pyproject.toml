[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = ["W191"]

[tool.isort]
src_paths = ""
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 119
ensure_newline_before_comments = true
lines_after_imports = 2
known_first_party = "omicstl"

[tool.nbqa.config]
isort = "pyproject.toml"
ruff = "pyproject.toml"
mypy = "setup.cfg"

[tool.nbqa.mutate]
isort = 1
ruff = 1
pyupgrade = 1

[tool.nbqa.files]
isort = "^notebooks/|^docs/users-guide/|.*\\.qmd$"
ruff = "^notebooks/|^docs/users-guide/|.*\\.qmd$"
pyupgrade = "^notebooks/|^docs/users-guide/|.*\\.qmd$"
mypy = "^notebooks/|^docs/users-guide/|.*\\.qmd$"

[tool.nbqa.addopts]
pyupgrade = ["--py312-plus"]

[tool.nbqa.ignore_cells]
isort = "%sh,%pip,%conda"
ruff = "%sh,%pip,%conda"
pyupgrade = "%sh,%pip,%conda"
mypy = "%sh,%pip,%conda"

[tool.pytest.ini_options]